name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        env:
          AGENT_API_KEY: ci-dummy
          REDIS_URL: fake://
        run: >-
          pytest tests/
          --ignore=tests/test_cp5.py
          --ignore=tests/test_bonus_cicd.py

  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: day12-agent:ci

  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install --global @railway/cli

      - name: Deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE || 'day12-agent' }}
        run: |
          test -n "$RAILWAY_TOKEN" || { echo "RAILWAY_TOKEN secret is not configured"; exit 1; }
          railway up --service "$RAILWAY_SERVICE" --detach

      - name: Smoke test
        env:
          PUBLIC_URL: ${{ vars.PUBLIC_URL || 'https://day12-2a202601111.up.railway.app' }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error "$PUBLIC_URL/health"; then
              exit 0
            fi
            sleep 10
          done
          exit 1
